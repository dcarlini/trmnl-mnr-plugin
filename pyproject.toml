[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trmnl-mnr-plugin"
version = "1.1.0b1"
description = "Metro-North Railroad trip finder with transfer support for TRMNL e-ink displays"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "dcarlini"},
]
maintainers = [
    {name = "dcarlini"},
]
keywords = ["metro-north", "train", "gtfs", "trmnl", "e-ink", "transit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "flask>=2.0.0",
    "requests>=2.25.0",
    "pytz>=2021.1",
    "protobuf>=3.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[project.urls]
Homepage = "https://github.com/dcarlini/trmnl-mnr-plugin"
Repository = "https://github.com/dcarlini/trmnl-mnr-plugin"
Issues = "https://github.com/dcarlini/trmnl-mnr-plugin/issues"
Changelog = "https://github.com/dcarlini/trmnl-mnr-plugin/blob/main/CHANGELOG.md"

[project.scripts]
mnr-trip-finder = "server.mnr_trip_finder:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]